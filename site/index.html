<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GamePlaza</title>
<!-- Ubuntu Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Main CSS -->
<link rel="stylesheet" href="/GamePlaza/plaza.css">
</head>
<body>
<canvas id="particles"></canvas>
<div id="loading">Loading games...</div>

<div id="main">

  <h1>
    <span class="magic">
      <span class="magic-text">Welcome to GamePlaza</span>
    </span>
  </h1>

  <h2>
    <span class="magic">
      <span class="magic-text">Summer Update</span>
      <div class="update-badge" id="update-trigger">Update Notes</div>
    </span>
  </h2>

  <input type="text" id="game-search" placeholder="Search games...">

  <div class="settings-section" style="margin-top:20px; margin-bottom:25px;">
    <h2>Your Activity</h2>
    <p style="color:#ccc; margin-bottom:12px;">
      ⭐ Favorites: <span id="favCount">0</span>
      &nbsp;&nbsp;&nbsp;&nbsp;
      ⏱ Recently Played: <span id="recentCount">0</span>
    </p>

    <div class="chip-row">
      <div class="chip" id="chip-fav">Favorites</div>
      <div class="chip" id="chip-recent">History</div>
      <div class="chip" id="chip-all">All</div>
    </div>
  </div>

  <div id="featured-container" class="button-container">
    <button onclick="window.location.href='requests.html'">Update Requests</button>
    <button onclick="window.location.href='proxy.html'">ProxyPlaza</button>
    <button onclick="window.location.href='settings.html'">Settings</button>
    <button id="surprise-btn">Surprise Me!</button>
  </div>

  <div class="chip-row" id="category-row"></div>

  <div class="button-container" id="game-grid"></div>

  <button id="backTop">↑</button>

  <footer style="text-align:center; margin-top:40px; opacity:0.8;">
    <p>GamePlaza © 2026 — Built by Mohammed</p>
  </footer>

  <div class="modal-overlay" id="updateModal">
    <div class="modal-content">
      <!-- modal content unchanged -->
    </div>
  </div>

</div> <!-- END OF #main -->

<script src="/GamePlaza/site/games.js"></script>
<script src="/GamePlaza/site/plaza.js"></script>

<meta property="og:title" content="GamePlaza">
<meta property="og:description" content="A beautiful game hub built by Mohammed.">
<meta property="og:image" content="/GamePlaza/preview.png">
<meta name="theme-color" content="#7B1FA2">

</body>
</html>
