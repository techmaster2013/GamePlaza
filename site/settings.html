<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings | GamePlaza</title>
<link rel="stylesheet" href="/GamePlaza/plaza.css">
<style>
/* Toggle Switch */
.toggle {
  position: relative;
  width: 55px;
  height: 28px;
  display: inline-block;
  margin: 10px 0;
}
.toggle input {
  display: none;
}
.slider {
  position: absolute;
  cursor: pointer;
  background: #3a2a55;
  border-radius: 34px;
  top: 0; left: 0; right: 0; bottom: 0;
  transition: .3s;
  border: 2px solid var(--purple);
}
.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 4px;
  bottom: 3px;
  background: var(--pink);
  border-radius: 50%;
  transition: .3s;
}
input:checked + .slider {
  background: var(--violet);
  border-color: var(--pink);
}
input:checked + .slider:before {
  transform: translateX(26px);
}
.settings-section button {
  background: #190f26;
  border: 2px solid var(--purple);
  border-radius: 12px;
  padding: 12px 20px;
  color: #F9F6EF;
  font-family: 'Ubuntu', sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin: 8px 8px 8px 0;
  transition: all 0.3s;
}
.settings-section button:hover {
  transform: translateY(-3px);
  background: #25163a;
  border-color: var(--pink);
  box-shadow: 0 0 15px rgba(123,31,162,0.7),
              0 0 30px rgba(244,143,177,0.3);
}
</style>
</head>

<body>

<h1>
  <span class="magic">
    <span class="magic-text">Settings</span>
  </span>
</h1>

<a href="index.html" class="chip" style="margin-bottom:20px; display:inline-block;">← Back to GamePlaza</a>

<!-- ACTIVITY -->
<div class="settings-section">
  <h2>Your Activity</h2>
  <button id="clearFav">Clear Favorites</button>
  <button id="clearRecent">Clear Recently Played</button>
</div>

<!-- TAB CLOAK -->
<div class="settings-section">
  <h2>Tab Cloak</h2>

  <label class="toggle">
    <input id="cloakGoogle" type="checkbox">
    <span class="slider"></span>
  </label> Google

  <br>

  <label class="toggle">
    <input id="cloakCustom" type="checkbox">
    <span class="slider"></span>
  </label> Custom Cloak

  <input id="cloakTitle" placeholder="Custom Title">
  <input id="cloakIcon" placeholder="Favicon URL">

  <button id="applyCustom">Apply Custom</button>
</div>

<!-- MOBILE SIZER -->
<div class="settings-section">
  <h2>Mobile Screen Sizer</h2>

  <label class="toggle">
    <input id="mobileSizer" type="checkbox">
    <span class="slider"></span>
  </label> Enable Mobile Mode
</div>

<!-- ANTI DELEDAO -->
<div class="settings-section">
  <h2>Anti-Deledao</h2>

  <label class="toggle">
    <input id="antiDeledao" type="checkbox">
    <span class="slider"></span>
  </label> Enable Anti-Deledao
</div>

<!-- ABOUT:BLANK -->
<div class="settings-section">
  <h2>About:blank Cloaker</h2>
  <button ondblclick="cloakBlank()">Cloak (Double-click)</button>
</div>

<script src="plaza.js"></script>

<script>
// Load saved settings into toggles
window.onload = () => {
  document.getElementById("mobileSizer").checked =
    localStorage.getItem("gp_mobile_sizer") === "enabled";

  document.getElementById("antiDeledao").checked =
    localStorage.getItem("gp_deledao") === "enabled";

  document.getElementById("cloakGoogle").checked =
    localStorage.getItem("gp_cloak_title") === "Google";

  document.getElementById("cloakCustom").checked =
    localStorage.getItem("gp_cloak_title") &&
    localStorage.getItem("gp_cloak_title") !== "Google";
};

// Activity
clearFav.onclick = () => {
  localStorage.removeItem("gp_favorites");
  alert("Favorites cleared!");
};
clearRecent.onclick = () => {
  localStorage.removeItem("gp_recent");
  alert("Recently Played cleared!");
};

// Cloak
cloakGoogle.onchange = () => {
  if (cloakGoogle.checked) {
    localStorage.setItem("gp_cloak_title", "Google");
    localStorage.setItem("gp_cloak_icon", "https://www.google.com/favicon.ico");
  } else {
    localStorage.removeItem("gp_cloak_title");
    localStorage.removeItem("gp_cloak_icon");
  }
};

applyCustom.onclick = () => {
  const t = cloakTitle.value;
  const i = cloakIcon.value;
  if (t) localStorage.setItem("gp_cloak_title", t);
  if (i) localStorage.setItem("gp_cloak_icon", i);
  alert("Custom cloak applied!");
};

// Mobile Sizer
mobileSizer.onchange = () => {
  if (mobileSizer.checked)
    localStorage.setItem("gp_mobile_sizer", "enabled");
  else
    localStorage.removeItem("gp_mobile_sizer");
};

// Anti-Deledao
antiDeledao.onchange = () => {
  if (antiDeledao.checked)
    localStorage.setItem("gp_deledao", "enabled");
  else
    localStorage.removeItem("gp_deledao");
};

// About:blank
function cloakBlank() {
  window.location.replace("about:blank");
}
</script>

</body>
</html>
