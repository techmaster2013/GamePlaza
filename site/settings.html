<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings | GamePlaza</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="/GamePlaza/plaza.css">

  <!-- Toggle Switch Styling -->
  <style>
    .toggle {
      position: relative;
      width: 55px;
      height: 28px;
      display: inline-block;
      margin-right: 10px;
    }
    .toggle input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      background: #3a2a55;
      border-radius: 34px;
      top: 0; left: 0; right: 0; bottom: 0;
      transition: .3s;
      border: 2px solid var(--purple);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 3px;
      background: var(--pink);
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider {
      background: var(--violet);
      border-color: var(--pink);
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .settings-section {
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-left: 4px solid var(--purple);
      margin-bottom: 25px;
      border-radius: 10px;
    }

    .settings-section h2 {
      margin-top: 0;
      margin-bottom: 12px;
      background: linear-gradient(to right, var(--purple), var(--violet), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-section input {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 10px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      color: #e5e5e5;
      font-family: Ubuntu;
    }
  </style>
</head>

<body>
  <canvas id="particles"></canvas>

  <div id="main">

    <h1>
      <span class="magic">
        <span class="magic-text">Settings</span>
      </span>
    </h1>

    <a href="index.html" class="chip" style="margin-bottom:20px; display:inline-block;">
      ← Back to GamePlaza
    </a>

    <!-- ACTIVITY -->
    <div class="settings-section">
      <h2>Your Activity</h2>
      <button id="clearFav">Clear Favorites</button>
      <button id="clearRecent">Clear Recently Played</button>
    </div>

    <!-- TAB CLOAK -->
    <div class="settings-section">
      <h2>Tab Cloak</h2>

      <label class="toggle">
        <input id="cloakGoogle" type="checkbox">
        <span class="slider"></span>
      </label>
      Google

      <br><br>

      <label class="toggle">
        <input id="cloakCustom" type="checkbox">
        <span class="slider"></span>
      </label>
      Custom Cloak

      <input id="cloakTitle" placeholder="Custom Title">
      <input id="cloakIcon" placeholder="Favicon URL">

      <button id="applyCustom">Apply Custom</button>
    </div>

    <!-- MOBILE SIZER -->
    <div class="settings-section">
      <h2>Mobile Screen Sizer</h2>

      <label class="toggle">
        <input id="mobileSizer" type="checkbox">
        <span class="slider"></span>
      </label>
      Enable Mobile Mode
    </div>

    <!-- ANTI DELEDAO -->
    <div class="settings-section">
      <h2>Anti-Deledao</h2>

      <label class="toggle">
        <input id="antiDeledao" type="checkbox">
        <span class="slider"></span>
      </label>
      Enable Anti-Deledao
    </div>

    <!-- ABOUT:BLANK -->
    <div class="settings-section">
      <h2>About:blank Cloaker</h2>
      <button ondblclick="cloakBlank()">Cloak (Double-click)</button>
    </div>

  </div> <!-- END MAIN -->

  <script src="/GamePlaza/site/plaza.js"></script>
</body>
</html>
