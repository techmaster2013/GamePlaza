<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings | GamePlaza</title>

<!-- Correct CSS path -->
<link rel="stylesheet" href="/GamePlaza/plaza.css">

</head>
<body>

<h1>
    <span class="magic">
        <span class="magic-text">Settings</span>
    </span>
</h1>

<!-- Back Button -->
<a href="index.html" class="chip" style="margin-bottom:20px; display:inline-block;">← Back to GamePlaza</a>

<!-- ⭐ ACTIVITY SETTINGS -->
<div class="settings-section">
    <h2>Your Activity</h2>

    <p>Manage your Favorites and Recently Played lists.</p>

    <button class="chip" id="clearFav">Clear Favorites</button>
    <button class="chip" id="clearRecent">Clear Recently Played</button>
</div>

<!-- ⭐ TAB CLOAK -->
<div class="settings-section">
    <h2>Tab Cloak</h2>

    <div class="chip-row">
        <button class="chip" onclick="presetCloak('Google')">Google</button>
        <button class="chip" onclick="presetCloak('Set')">Set Cloak</button>
        <button class="chip" onclick="resetCloak()">Reset Cloak</button>
    </div>

    <h3>Custom Cloak</h3>
    <input id="cloakTitle" placeholder="Custom tab title">
    <input id="cloakIcon" placeholder="Favicon URL">

    <button class="chip" onclick="applyCustomCloak()">Apply Custom</button>
</div>

<!-- ⭐ MOBILE SIZER -->
<div class="settings-section">
    <h2>Mobile Screen Sizer</h2>

    <button class="chip" onclick="enableSizer()">Enable</button>
    <button class="chip" onclick="disableSizer()">Disable</button>
</div>

<!-- ⭐ ANTI DELEDAO -->
<div class="settings-section">
    <h2>Anti-Deledao</h2>

    <button class="chip" onclick="enableDeledao()">Enable</button>
    <button class="chip" onclick="disableDeledao()">Disable</button>
</div>

<!-- ⭐ ABOUT:BLANK CLOAKER -->
<div class="settings-section">
    <h2>About:blank Cloaker</h2>

    <button class="chip" ondblclick="cloakBlank()">Cloak (Double-click)</button>
</div>

<!-- Load plaza.js -->
<script src="plaza.js"></script>

<script>
// Activity
document.getElementById("clearFav").onclick = () => {
    localStorage.removeItem("gp_favorites");
    alert("Favorites cleared!");
};

document.getElementById("clearRecent").onclick = () => {
    localStorage.removeItem("gp_recent");
    alert("Recently Played cleared!");
};

// Cloak
function presetCloak(type) {
    if (type === "Google") {
        localStorage.setItem("gp_cloak_title", "Google");
        localStorage.setItem("gp_cloak_icon", "https://www.google.com/favicon.ico");
    }
    if (type === "Set") {
        localStorage.setItem("gp_cloak_title", "Set");
        localStorage.setItem("gp_cloak_icon", "/GamePlaza/icon.png");
    }
    alert("Cloak applied!");
}

function resetCloak() {
    localStorage.removeItem("gp_cloak_title");
    localStorage.removeItem("gp_cloak_icon");
    alert("Cloak reset!");
}

function applyCustomCloak() {
    const title = document.getElementById("cloakTitle").value;
    const icon = document.getElementById("cloakIcon").value;

    if (title) localStorage.setItem("gp_cloak_title", title);
    if (icon) localStorage.setItem("gp_cloak_icon", icon);

    alert("Custom cloak applied!");
}

// Mobile Sizer
function enableSizer() {
    localStorage.setItem("gp_mobile_sizer", "enabled");
    alert("Mobile Sizer Enabled");
}

function disableSizer() {
    localStorage.removeItem("gp_mobile_sizer");
    alert("Mobile Sizer Disabled");
}

// Anti Deledao
function enableDeledao() {
    localStorage.setItem("gp_deledao", "enabled");
    alert("Anti-Deledao Enabled");
}

function disableDeledao() {
    localStorage.removeItem("gp_deledao");
    alert("Anti-Deledao Disabled");
}

// About:blank Cloaker
function cloakBlank() {
    window.location.replace("about:blank");
}
</script>

</body>
</html>
