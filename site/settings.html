<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | GamePlaza</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&amp;display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="/GamePlaza/plaza.css">

  <meta property="og:title" content="GamePlaza Settings">
  <meta property="og:description" content="GamePlaza Settings - Customize your experience">
  <meta property="og:image" content="/GamePlaza/Normal.png">
  <meta name="theme-color" content="#7B1FA2">

  <style>
    .toggle {
      position: relative;
      width: 55px;
      height: 28px;
      display: inline-block;
      margin-right: 10px;
      vertical-align: middle;
    }
    .toggle input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      background: #3a2a55;
      border-radius: 34px;
      top: 0; left: 0; right: 0; bottom: 0;
      transition: .3s;
      border: 2px solid var(--purple);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 3px;
      background: var(--pink);
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider {
      background: var(--violet);
      border-color: var(--pink);
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      margin: 12px 0;
      font-size: 15px;
      color: #F9F6EF;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .preset-grid button {
      background: #190f26;
      border: 2px solid var(--purple);
      border-radius: 10px;
      padding: 10px;
      color: #F9F6EF;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-family: Ubuntu;
      font-weight: 500;
    }

    .preset-grid button:hover {
      background: #25163a;
      border-color: var(--pink);
      box-shadow: 0 0 12px rgba(123,31,162,0.7);
      transform: translateY(-3px);
    }

    .preset-grid button:active {
      transform: scale(0.95);
    }

    .settings-section input {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 10px;
      background: #0f0f0f;
      border: 1px solid #1f1f1f;
      color: #e5e5e5;
      font-family: Ubuntu;
      font-size: 14px;
      transition: 0.25s ease;
      box-sizing: border-box;
    }

    .settings-section input:focus {
      outline: none;
      background: #151515;
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .settings-section input::placeholder {
      color: #777;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <!-- particles -->
  <canvas id="particles" width="252" height="782"></canvas>

  <div id="main">

    <h1>
      <span class="magic">
        <span class="magic-text">Settings</span>
      </span>
    </h1>

    <a href="index.html" class="chip back-link">
      ← Back to GamePlaza
    </a>

    <!-- ACTIVITY -->
    <div class="settings-section">
      <h2>Your Activity</h2>
      <button id="clearFav">Clear Favorites</button>
      <button id="clearRecent">Clear Recently Played</button>
    </div>

    <!-- PRESET CLOAKS -->
    <div class="settings-section">
      <h2>Preset Cloaks (applies on reload)</h2>

      <div class="preset-grid">
        <button onclick="applyPreset('Google','https://www.google.com/favicon.ico')">Google</button>
        <button onclick="applyPreset('Google Drive','https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png')">Drive</button>
        <button onclick="applyPreset('Google Classroom','https://ssl.gstatic.com/classroom/favicon.png')">Classroom</button>
        <button onclick="applyPreset('Gmail','https://mail.google.com/favicon.ico')">Gmail</button>
        <button onclick="applyPreset('Canvas','https://canvas.instructure.com/favicon.ico')">Canvas</button>
        <button onclick="applyPreset('Zoom','https://zoom.us/favicon.ico')">Zoom</button>
        <button onclick="applyPreset('Google Docs','https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png')">Docs</button>
        <button onclick="applyPreset('Google Sheets','https://ssl.gstatic.com/docs/spreadsheets/favicon3.ico')">Sheets</button>
        <button onclick="applyPreset('Google Meet','https://meet.google.com/favicon.ico')">Meet</button>
        <button onclick="applyPreset('Google Calendar','https://calendar.google.com/googlecalendar/images/favicon.ico')">Calendar</button>
        <button onclick="applyPreset('Microsoft Word','https://static-00.iconduck.com/assets.00/microsoft-word-icon-512x512-8zj6z1xv.png')">Word</button>
        <button onclick="applyPreset('PowerPoint','https://static-00.iconduck.com/assets.00/powerpoint-icon-512x512-1o5x7x1t.png')">PowerPoint</button>
        <button onclick="applyPreset('YouTube','https://www.youtube.com/s/desktop/fe2f3e9b/img/favicon.ico')">YouTube</button>
        <button onclick="applyPreset('Khan Academy','https://www.khanacademy.org/favicon.ico')">Khan Academy</button>
        <button onclick="applyPreset('Search','https://www.google.com/favicon.ico')">Fake Search</button>
      </div>
    </div>

    <!-- CUSTOM CLOAK -->
    <div class="settings-section">
      <h2>Custom Cloak</h2>

      <div class="toggle-label">
        <label class="toggle">
          <input id="cloakCustom" type="checkbox">
          <span class="slider"></span>
        </label>
        <span>Enable Custom Cloak</span>
      </div>

      <input id="cloakTitle" placeholder="Title - Type GamePlaza to reset">
      <input id="cloakIcon" placeholder="Favicon - Type /GamePlaza/Normal.png to reset">

      <button id="applyCustom">Apply Custom Cloak (applies on reload)</button>
    </div>

    <!-- MOBILE -->
    <div class="settings-section">
      <h2>Mobile Screen Sizer</h2>

      <div class="toggle-label">
        <label class="toggle">
          <input id="mobileSizer" type="checkbox">
          <span class="slider"></span>
        </label>
        <span>Enable Mobile Mode</span>
      </div>
    </div>

    <!-- ANTI DELEDAO -->
    <div class="settings-section">
      <h2>Anti-Deledao</h2>

      <div class="toggle-label">
        <label class="toggle">
          <input id="antiDeledao" type="checkbox">
          <span class="slider"></span>
        </label>
        <span>Enable Anti-Deledao</span>
      </div>
    </div>

    <!-- ABOUT BLANK -->
    <div class="settings-section">
      <h2>About:blank Cloaker</h2>
      <button onclick="cloakBlankReal()" ondblclick="event.preventDefault()">Cloak GamePlaza (double-click)</button>
    </div>

    <footer style="text-align:center; margin-top:40px; opacity:0.8;">
      <p>GamePlaza © 2026 — Built by h_z13</p>
    </footer>

  </div>

  <script src="/GamePlaza/site/plaza.js"></script>

  <script>
    // Detect if we're on settings page and run settings-specific logic
    if (document.title.includes("Settings")) {
      // This allows plaza.js to run its settings logic
    }

    function applyPreset(title, icon) {
      localStorage.setItem("gp_cloak_title", title);
      localStorage.setItem("gp_cloak_icon", icon);
      alert("Preset will be applied when you reload!");
    }

    function cloakBlankReal() {
      try {
        const win = window.open("about:blank", "_blank");
        if (!win) {
          alert("Failed to open window. Please check pop-up blocker settings.");
          return;
        }
        
        const doc = win.document;
        doc.title = localStorage.getItem("gp_cloak_title") || "Google";
        
        const link = doc.createElement("link");
        link.rel = "icon";
        link.href = localStorage.getItem("gp_cloak_icon") || "https://www.google.com/favicon.ico";
        doc.head.appendChild(link);

        const iframe = doc.createElement("iframe");
        iframe.src = window.location.href;
        iframe.style.position = "fixed";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        iframe.style.margin = "0";
        iframe.style.padding = "0";

        doc.body.style.margin = "0";
        doc.body.style.padding = "0";
        doc.body.appendChild(iframe);
      } catch (e) {
        alert("Error: " + e.message);
      }
    }
  </script>

</body>
</html>
