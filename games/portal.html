<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal | GamePlaza</title>
<style>
/* Remove default margins so the container spans edge-to-edge */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Prevents unwanted double scrollbars */
}

/* Force the Ruffle element to dynamically map to the browser tab size */
#ruffle-container, ruffle-player {
    width: 100vw !important;
    height: 100vh !important;
    display: block;
}
</style>
    <!-- 1. Load Ruffle via CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<object data="/GamePlaza/games/Portal.swf">
        <!-- Optional fallback parameters -->
        <param name="movie" value="/GamePlaza/games/Portal.swf" />
    </object>

</head>
</html>
