<!DOCTYPE html>
<html>
<head>
    <title>Eggfish | GamePlaza</title>
    <!-- Your Gameplaza stylesheet -->
    <link rel="stylesheet" href="styles.css"> 
    
    <!-- Your requested high-res favicon asset -->
    <link rel="icon" type="image/png" sizes="any" href="https://img.itch.zone/aW1nLzI4MDI5NzE3LnBuZw==/original/FeXDc3.png">
</head>
<body>

    <!-- Ensure your button class matches your styles.css centering layout -->
    <button onclick="launchGame()" class="launcher-btn">Launch Eggfish on GamePlaza</button>

    <!-- THE FIX: This script block must be completely valid and closed -->
    <script>
        function launchGame() {
            // Your exact working documentation fetch line
            fetch(`https://allorigins.win{encodeURIComponent('https://burghbrain.itch.io/eggfish')}`)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Network response was not ok.');
            })
            .then(data => {
                // Matches the live, changing itch.zone link inside the HTML text
                const regex = /https:\/\/html-classic\.itch\.zone\/html\/[0-9\-]+\/index\.html/;
                const match = data.contents.match(regex);
                
                if (match) {
                    // Extract the clean URL string from the regex array match
                    window.location.href = match[0]; 
                } else {
                    alert("Could not locate the live itch.zone update link.");
                }
            })
            .catch(err => {
                alert("Proxy Error: " + err.message);
            });
        }
    </script>
</body>
</html>
