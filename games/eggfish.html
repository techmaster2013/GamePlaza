<!DOCTYPE html>
<html>
<head>
    <title>Eggfish Launcher</title>
    <!-- Links your Gameplaza stylesheet -->
    <link rel="stylesheet" href="/GamePlaza/site/Styles.css"> 
    <!-- High-res favicon asset -->
    <link rel="icon" type="image/png" sizes="any" href="https://img.itch.zone/aW1nLzI4MDI5NzE3LnBuZw==/original/FeXDc3.png">

    <!-- THE FIX: We load your proxy's own Ultraviolet script helper files directly -->
    <script src="https://proxy-plaza.vercel.app/uv/uv.bundle.js"></script>
    <script src="https://proxy-plaza.vercel.app/uv/uv.config.js"></script>
<style>
    .launcher-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 40px;
    font-size: 24px;
    font-family: sans-serif; /* Changes font to look cleaner */
    background-color: #ff2449; /* Optional: adds an itch-style red button */
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.launcher-btn:hover {
    background-color: #dd1c3b; /* Makes it change color when hovered */
}
</style>
</head>
<body>

    <!-- Styled launcher button -->
    <button onclick="launchGame()" class="launcher-btn">Launch Latest Eggfish Build</button>

    <script>
        function launchGame() {
            // Verify that the Ultraviolet script elements loaded successfully
            if (typeof __uv$config === 'undefined') {
                alert("Proxy engine failed to load. Ensure proxy-plaza.vercel.app is accessible.");
                return;
            }

            const targetUrl = 'https://burghbrain.itch.io/eggfish';
            
            // Replicates Ultraviolet's internal encryption scheme natively
            const uvEncodedUrl = 'https://proxy-plaza.vercel.app/' + __uv$config.encodeUrl(targetUrl);
            
            // Bypasses fetch completely by launching the target directly inside the proxy frame
            window.location.href = uvEncodedUrl;
        }
    </script>
</body>
</html>
