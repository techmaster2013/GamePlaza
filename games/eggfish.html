<!DOCTYPE html>
<html>
<head>
    <title>Eggfish | GamePlaza</title>
</head>
<body>
    <button onclick="launchGame()" style="padding: 20px; font-size: 20px;">Launch Eggfish on GamePlaza</button>
    <script>
        function launchGame() {
            // Reaches out to the specific game page via the CORS proxy
            fetch('https://allorigins.win' + encodeURIComponent('https://burghbrain.itch.io/eggfish'))
            .then(response => response.json())
            .then(data => {
                // Finds the live changing itch.zone link inside the HTML text
                const match = data.contents.match(/https:\/\/html-classic\.itch\.zone\/html\/\d+\/[^"]+/);
                if (match) {
                    window.location.href = match[0];
                } else {
                    alert("Could not find the update path. Check your proxy connection.");
                }
            });
        }
    </script>
</body>
</html>
