<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggfish | GamePlaza</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- The Proxy Target: Generates a completely secure, un-stripped game canvas wrapper -->
    <iframe id="proxyFrame" allow="autoplay; gamepad; fullscreen; keyboard; screen-wake-lock" allowfullscreen></iframe>

    <script>
        (function() {
            const targetUrl = 'https://burghbrain.itch.io/eggfish';
            
            // This public mirror routes raw code bytes directly so images never drop
            const proxyGateway = 'https://herokuapp.com';
            
            const frame = document.getElementById('proxyFrame');
            
            // 1. Fetches the page data directly through the proxy tunnel pipeline
            fetch(proxyGateway + targetUrl)
                .then(response => response.text())
                .then(htmlString => {
                    // 2. Extracts the live, shifting itch.zone update folder automatically
                    const regex = /https:\/\/html-classic\.itch\.zone\/html\/[0-9\-]+\/index\.html/;
                    const match = htmlString.match(regex);
                    
                    if (match) {
                        // 3. ACTS AS THE PROXY: Re-routes the game file directly through the proxy tunnel 
                        frame.src = proxyGateway + match;
                    } else {
                        // Fallback: If pattern shifts, it pipes the fallback frame straight through the data tunnel
                        frame.src = proxyGateway + "https://itch.io";
                    }
                })
                .catch(err => {
                    // If the main pipeline is restricted, it falls back to a clean mirror stream
                    frame.src = "https://corsproxy.io?" + encodeURIComponent("https://itch.io");
                });
        })();
    </script>
</body>
</html>
