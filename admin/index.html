<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePlaza Admin</title>
    <link rel="icon" href="../Normal.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #7b1fa2;
            --violet: #673ab7;
            --pink: #f48fb1;
            --bg: #0d0619;
            --panel: rgba(25, 15, 38, .92);
            --panel-2: rgba(36, 24, 52, .92);
            --text: #f9f6ef;
            --muted: #aaa1b2;
            --border: rgba(244, 143, 177, .25);
            --green: #65d69a;
            --red: #ff6b81;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            font-family: "Ubuntu", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(123,31,162,.22), transparent 34rem),
                linear-gradient(135deg, #1a0f2e, var(--bg) 55%, #160a26);
        }

        button, input { font: inherit; }

        button {
            border: 0;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        .shell {
            width: min(1180px, 92vw);
            margin: 0 auto;
            padding: 42px 0 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--purple), var(--violet));
            font-size: 22px;
        }

        h1, h2, p { margin-top: 0; }

        h1 {
            margin-bottom: 3px;
            font-size: 28px;
        }

        .subtitle { color: var(--muted); }

        .auth-card, .dashboard {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 18px 60px rgba(0,0,0,.35);
        }

        .auth-card {
            width: min(440px, 100%);
            margin: 8vh auto 0;
            padding: 30px;
        }

        .auth-card h1 {
            background: linear-gradient(90deg, var(--purple), var(--violet), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .field {
            display: grid;
            gap: 8px;
            margin: 18px 0;
        }

        label {
            color: #ddd4e1;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            color: var(--text);
            background: #0f0a16;
            border: 1px solid #382844;
            border-radius: 12px;
            outline: none;
        }

        input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(244,143,177,.12);
        }

        .primary {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            background: linear-gradient(135deg, var(--purple), var(--violet));
        }

        .primary:hover { filter: brightness(1.08); }

        .error {
            margin-top: 14px;
            color: #ff9aaa;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat {
            padding: 18px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
        }

        .stat-value {
            margin-top: 5px;
            font-size: 28px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px;
            margin-bottom: 18px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter {
            padding: 9px 13px;
            border-radius: 10px;
            color: #d9cfdf;
            background: #17101f;
            border: 1px solid #382844;
        }

        .filter.active {
            color: white;
            border-color: var(--pink);
            background: rgba(244,143,177,.12);
        }

        .secondary {
            padding: 9px 13px;
            border-radius: 10px;
            color: #eee;
            background: #20152a;
            border: 1px solid #3d2a48;
        }

        .feedback-list {
            display: grid;
            gap: 12px;
        }

        .feedback {
            padding: 20px;
            background: rgba(25,15,38,.96);
            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .feedback-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #251936;
            color: #e6d8ea;
        }

        .badge.status {
            color: #8ff0bb;
            background: rgba(101,214,154,.11);
        }

        .badge.source {
            color: #d8c4ff;
            background: rgba(103,58,183,.18);
        }

        .message {
            margin: 0;
            white-space: pre-wrap;
            line-height: 1.55;
            color: #f2edf4;
            overflow-wrap: anywhere;
        }

        .game {
            margin-top: 10px;
            color: var(--muted);
            font-size: 14px;
        }

        .date {
            margin-top: 10px;
            color: #817789;
            font-size: 12px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .resolve {
            padding: 9px 12px;
            border-radius: 10px;
            color: #9cf0c1;
            background: rgba(101,214,154,.1);
            border: 1px solid rgba(101,214,154,.28);
        }

        .delete {
            padding: 9px 12px;
            border-radius: 10px;
            color: #ff9aaa;
            background: rgba(255,107,129,.08);
            border: 1px solid rgba(255,107,129,.25);
        }

        .empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed #3b2c45;
            border-radius: 16px;
        }

        .empty strong {
            display: block;
            color: #e9e0eb;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .loading {
            color: var(--muted);
            text-align: center;
            padding: 25px;
        }

        .logout {
            padding: 9px 13px;
            border-radius: 10px;
            color: #ddd;
            background: #20152a;
            border: 1px solid #3d2a48;
        }

        @media (max-width: 700px) {
            .shell { padding-top: 25px; }
            .topbar { align-items: flex-start; }
            .stats { grid-template-columns: 1fr; }
            .feedback-head { flex-direction: column; }
            .actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section id="loginView" class="auth-card">
            <div class="brand">
                <div class="brand-icon">🎮</div>
                <div>
                    <h1>GamePlaza Admin</h1>
                    <div class="subtitle">Private feedback dashboard</div>
                </div>
            </div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="primary" type="submit">Sign In</button>
                <div id="loginError" class="error hidden" role="alert"></div>
            </form>
        </section>

        <section id="dashboardView" class="dashboard hidden" style="padding: 26px;">
            <header class="topbar">
                <div class="brand">
                    <div class="brand-icon">🎮</div>
                    <div>
                        <h1>Feedback</h1>
                        <div id="signedInAs" class="subtitle">Signed in</div>
                    </div>
                </div>
                <button id="logoutButton" class="logout" type="button">Sign Out</button>
            </header>

            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Unresolved</div>
                    <div id="unresolvedCount" class="stat-value">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Resolved</div>
                    <div id="resolvedCount" class="stat-value">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total</div>
                    <div id="totalCount" class="stat-value">0</div>
                </div>
            </div>

            <div class="controls">
                <div class="filters" role="group" aria-label="Feedback status">
                    <button class="filter active" data-status="unresolved" type="button">Unresolved</button>
                    <button class="filter" data-status="resolved" type="button">Resolved</button>
                    <button class="filter" data-status="all" type="button">All</button>
                </div>
                <button id="refreshButton" class="secondary" type="button">Refresh</button>
            </div>

            <div id="feedbackList" class="feedback-list">
                <div class="loading">Loading feedback…</div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            query,
            orderBy,
            onSnapshot,
            doc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        // Replace these values with the Web app configuration from:
        // Firebase Console → Project settings → General → Your apps → Web app
        const firebaseConfig = {
            apiKey: "PASTE_WEB_API_KEY_HERE",
            authDomain: "gplaza-feedback.firebaseapp.com",
            projectId: "gplaza-feedback",
            messagingSenderId: "PASTE_MESSAGING_SENDER_ID_HERE",
            appId: "PASTE_WEB_APP_ID_HERE"
        };

        const configIsReady =
            !firebaseConfig.apiKey.startsWith("PASTE_") &&
            !firebaseConfig.messagingSenderId.startsWith("PASTE_") &&
            !firebaseConfig.appId.startsWith("PASTE_");

        const loginView = document.getElementById("loginView");
        const dashboardView = document.getElementById("dashboardView");
        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");
        const signedInAs = document.getElementById("signedInAs");
        const logoutButton = document.getElementById("logoutButton");
        const refreshButton = document.getElementById("refreshButton");
        const feedbackList = document.getElementById("feedbackList");
        const unresolvedCount = document.getElementById("unresolvedCount");
        const resolvedCount = document.getElementById("resolvedCount");
        const totalCount = document.getElementById("totalCount");

        let activeStatus = "unresolved";
        let feedback = [];
        let unsubscribeFeedback = null;

        function showLoginError(message) {
            loginError.textContent = message;
            loginError.classList.remove("hidden");
        }

        function clearLoginError() {
            loginError.textContent = "";
            loginError.classList.add("hidden");
        }

        function formatDate(timestamp) {
            if (!timestamp || typeof timestamp.toDate !== "function") {
                return "Date unavailable";
            }

            return timestamp.toDate().toLocaleString();
        }

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function render() {
            const unresolved = feedback.filter(item => item.status === "unresolved").length;
            const resolved = feedback.filter(item => item.status === "resolved").length;

            unresolvedCount.textContent = unresolved;
            resolvedCount.textContent = resolved;
            totalCount.textContent = feedback.length;

            const visible = activeStatus === "all"
                ? feedback
                : feedback.filter(item => item.status === activeStatus);

            if (!visible.length) {
                feedbackList.innerHTML = `
                    <div class="empty">
                        <strong>No feedback here</strong>
                        ${activeStatus === "unresolved" ? "You're all caught up. 🎉" : "Nothing matches this filter."}
                    </div>
                `;
                return;
            }

            feedbackList.innerHTML = visible.map(item => {
                const game = item.game ? `<div class="game">🎮 ${escapeHTML(item.game)}</div>` : "";
                const nextStatus = item.status === "resolved" ? "unresolved" : "resolved";
                const actionText = item.status === "resolved" ? "Mark Unresolved" : "Resolve";

                return `
                    <article class="feedback">
                        <div class="feedback-head">
                            <div>
                                <div class="meta">
                                    <span class="badge">${escapeHTML(item.category || "other")}</span>
                                    <span class="badge source">${escapeHTML(item.source || "Unknown")}</span>
                                    <span class="badge status">${escapeHTML(item.status || "unresolved")}</span>
                                </div>
                                <p class="message">${escapeHTML(item.message || "")}</p>
                                ${game}
                                <div class="date">${formatDate(item.createdAt)}</div>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="resolve" data-action="status" data-id="${escapeHTML(item.id)}" data-status="${nextStatus}" type="button">${actionText}</button>
                            <button class="delete" data-action="delete" data-id="${escapeHTML(item.id)}" type="button">Delete</button>
                        </div>
                    </article>
                `;
            }).join("");
        }

        function listenForFeedback() {
            if (unsubscribeFeedback) {
                unsubscribeFeedback();
            }

            const feedbackQuery = query(
                collection(db, "feedback"),
                orderBy("createdAt", "desc")
            );

            unsubscribeFeedback = onSnapshot(
                feedbackQuery,
                snapshot => {
                    feedback = snapshot.docs.map(item => ({
                        id: item.id,
                        ...item.data()
                    }));
                    render();
                },
                error => {
                    feedbackList.innerHTML = `
                        <div class="empty">
                            <strong>Couldn't load feedback</strong>
                            ${escapeHTML(error.message)}
                        </div>
                    `;
                }
            );
        }

        async function changeStatus(id, status) {
            try {
                await updateDoc(doc(db, "feedback", id), { status });
            } catch (error) {
                alert("Couldn't update feedback: " + error.message);
            }
        }

        async function removeFeedback(id) {
            if (!confirm("Delete this feedback permanently?")) {
                return;
            }

            try {
                await deleteDoc(doc(db, "feedback", id));
            } catch (error) {
                alert("Couldn't delete feedback: " + error.message);
            }
        }

        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            clearLoginError();

            if (!configIsReady) {
                showLoginError("Firebase Web app configuration has not been added yet.");
                return;
            }

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showLoginError(error.message);
            }
        });

        logoutButton.addEventListener("click", () => signOut(auth));

        refreshButton.addEventListener("click", () => {
            render();
        });

        document.querySelectorAll(".filter").forEach(button => {
            button.addEventListener("click", () => {
                activeStatus = button.dataset.status;

                document.querySelectorAll(".filter").forEach(item => {
                    item.classList.toggle("active", item === button);
                });

                render();
            });
        });

        feedbackList.addEventListener("click", event => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const id = button.dataset.id;

            if (button.dataset.action === "status") {
                changeStatus(id, button.dataset.status);
            }

            if (button.dataset.action === "delete") {
                removeFeedback(id);
            }
        });

        let app;
        let auth;
        let db;

        if (configIsReady) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, user => {
                if (user) {
                    loginView.classList.add("hidden");
                    dashboardView.classList.remove("hidden");
                    signedInAs.textContent = user.email || "Signed in";
                    listenForFeedback();
                } else {
                    dashboardView.classList.add("hidden");
                    loginView.classList.remove("hidden");

                    if (unsubscribeFeedback) {
                        unsubscribeFeedback();
                        unsubscribeFeedback = null;
                    }
                }
            });
        } else {
            showLoginError("Add the Firebase Web app configuration to enable the dashboard.");
        }
    </script>
</body>
</html>
