<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GamePlaza Changelog Editor</title>
<link rel="icon" href="../Normal.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#7b1fa2;--violet:#673ab7;--pink:#f48fb1;--bg:#0d0619;--panel:rgba(25,15,38,.94);--panel2:rgba(36,24,52,.94);--text:#f9f6ef;--muted:#aaa1b2;--border:rgba(244,143,177,.25);--green:#65d69a;--red:#ff6b81}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Ubuntu,sans-serif;color:var(--text);background:radial-gradient(circle at top,rgba(123,31,162,.22),transparent 34rem),linear-gradient(135deg,#1a0f2e,var(--bg) 55%,#160a26)}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1100px,92vw);margin:auto;padding:38px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--violet));font-size:22px}h1,h2,h3,p{margin-top:0}.sub{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.login{width:min(440px,100%);margin:10vh auto}.field{display:grid;gap:7px;margin:15px 0}label{font-size:14px;color:#ddd4e1;font-weight:500}input,textarea{width:100%;padding:12px 14px;color:var(--text);background:#0f0a16;border:1px solid #382844;border-radius:12px;outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,143,177,.12)}.primary,.secondary,.danger{border-radius:11px;padding:11px 15px;color:#fff;font-weight:700}.primary{background:linear-gradient(135deg,var(--purple),var(--violet))}.secondary{background:#20152a;border:1px solid #3d2a48}.danger{background:rgba(255,107,129,.08);border:1px solid rgba(255,107,129,.25);color:#ff9aaa}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.status{margin-top:14px;color:var(--green);min-height:20px}.error{color:#ff9aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.history{display:grid;gap:10px;margin-top:18px}.history article{padding:15px;background:var(--panel2);border:1px solid var(--border);border-radius:15px}.history-head{display:flex;justify-content:space-between;gap:10px}.history small{color:var(--muted)}.history button{padding:7px 10px;border-radius:9px;background:#20152a;border:1px solid #3d2a48;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="shell">
<section id="login" class="card login">
<div class="brand"><div class="icon">📝</div><div><h1>Changelog Editor</h1><div class="sub">Private GamePlaza update manager</div></div></div>
<form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%" type="submit">Sign In</button><p id="loginError" class="error"></p></form>
</section>
<section id="app" class="hidden">
<div class="top"><div><div class="brand"><div class="icon">📝</div><div><h1>Changelog Editor</h1><div class="sub">Publish a new update without losing the previous one.</div></div></div></div><button id="logout" class="secondary" type="button">Sign Out</button></div>
<div class="card">
<form id="editor">
<div class="grid">
<div class="field"><label for="version">Version / Date</label><input id="version" placeholder="September 21, 2026"></div>
<div class="field"><label for="title">Changelog Title</label><input id="title" placeholder="Fall Update"></div>
<div class="field wide"><label for="notes">Update Notes</label><textarea id="notes" placeholder="What's new in this update?"></textarea></div>
<div class="field"><label for="features">Features Added <small>(one per line)</small></label><textarea id="features"></textarea></div>
<div class="field"><label for="newGames">New Games <small>(one per line)</small></label><textarea id="newGames"></textarea></div>
<div class="field wide"><label for="bugs">Known Bugs <small>(one per line)</small></label><textarea id="bugs"></textarea></div>
<div class="field"><label for="releaseDate">Release Date</label><input id="releaseDate" placeholder="September 21st, 2026"></div>
</div>
<div class="actions"><button id="save" class="secondary" type="button">Save Current</button><button id="publish" class="primary" type="button">Publish as New Changelog</button><button id="blank" class="secondary" type="button">New Blank</button></div>
<p id="status" class="status"></p>
</form>
</div>
<div class="card" style="margin-top:16px"><h2>Previous Changelogs</h2><p class="sub">Publishing a new changelog automatically saves the current one here.</p><div id="history" class="history"></div></div>
</section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDAd_RUXKRdXICvOGTgrC3i7_PST_BxmtE",authDomain:"gplaza-feedback.firebaseapp.com",projectId:"gplaza-feedback",storageBucket:"gplaza-feedback.firebasestorage.app",messagingSenderId:"311535800676",appId:"1:311535800676:web:44bbebd348b5e3e9e66a71"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,"changelog","main");
const $=id=>document.getElementById(id);
let data={current:null,history:[]};
const lines=v=>Array.isArray(v)?v.join("\n"):"";
const readForm=()=>({version:$( "version").value.trim(),title:$( "title").value.trim(),notes:$( "notes").value.trim(),features:$( "features").value.split("\n").map(x=>x.trim()).filter(Boolean),newGames:$( "newGames").value.split("\n").map(x=>x.trim()).filter(Boolean),bugs:$( "bugs").value.split("\n").map(x=>x.trim()).filter(Boolean),releaseDate:$( "releaseDate").value.trim()});
const fill=item=>{const x=item||{};$( "version").value=x.version||"";$( "title").value=x.title||"";$( "notes").value=x.notes||"";$( "features").value=lines(x.features);$( "newGames").value=lines(x.newGames);$( "bugs").value=lines(x.bugs);$( "releaseDate").value=x.releaseDate||""};
const msg=(t,err=false)=>{const e=$( "status");e.textContent=t;e.className="status"+(err?" error":"")};
function renderHistory(){const root=$( "history");root.innerHTML="";if(!data.history.length){root.innerHTML='<p class="sub">No previous changelogs yet. Publish your first new one and it will appear here.</p>';return}data.history.forEach(item=>{const a=document.createElement("article");const h=document.createElement("div");h.className="history-head";const title=document.createElement("strong");title.textContent=(item.version||"Previous")+" — "+(item.title||"Update");const b=document.createElement("button");b.type="button";b.textContent="Load";b.onclick=()=>{fill(item);msg("Loaded historical changelog. Saving this will edit the current changelog; publishing will archive the current one again.")};h.append(title,b);a.append(h);const s=document.createElement("small");s.textContent=item.releaseDate||"";a.append(s);root.append(a)})}
const summerUpdate={version:"August 28, 2026",title:"Summer Update",notes:"give suggestions by pressing the feedback button — lots of QOL updates expected this summer!",features:["Switched games and most javascript to external file","Added categories & search improvements","Performance and accessibility improvements","UI overhaul","UI overhaul x2","Your activity section: view your favorites and your game history","Favorites - Press the star next to a game to favorite it.","History - View games that were played on your device before.","Renamed update requests to feedback","Removed GSite GamePlaza due to irrelevancy","Added clear button in search","Fixed button centering and resizing","Added GitHub repo button","Added coreHZ","You can now press Esc to leave the update modal","Search bar and title will occasionally change","Settings page is more streamlined and looks better","Added game preview embeds with a Play Game button"],newGames:["Granny","Angry Birds 2","Run 3","Revamped Minecraft, Zombs, and a few more","Fixed osu!","Added Roblox via nowgg.fun (yes it works unlike easyfun.gg)"],bugs:["Favicon can bug out","Loading games... will appear above games even though games are already loaded","Some external games may refuse to display a preview if their site blocks embedding."],releaseDate:"August 28th, 2026"};
async function load(){const snap=await getDoc(ref);if(snap.exists()){const d=snap.data();data={current:d.current||summerUpdate,history:Array.isArray(d.history)&&d.history.length?d.history:[summerUpdate]};}else{data={current:summerUpdate,history:[summerUpdate]};}fill(data.current);renderHistory()}
async function saveCurrent(){const current=readForm();await setDoc(ref,{current,history:data.history,updatedAt:serverTimestamp()},{merge:true});data.current=current;msg("Current changelog saved.")}
async function publish(){const next=readForm();if(!next.title){msg("Add a changelog title first.",true);return}const history=data.current?[data.current,...data.history]:data.history;await setDoc(ref,{current:next,history,updatedAt:serverTimestamp()},{merge:true});data.current=next;data.history=history;renderHistory();msg("Published! The previous changelog was saved to history. 🔥")}
$( "loginForm").addEventListener("submit",async e=>{e.preventDefault();$( "loginError").textContent="";try{await signInWithEmailAndPassword(auth,$( "email").value.trim(),$( "password").value)}catch(err){$( "loginError").textContent=err.message}});
$( "logout").onclick=()=>signOut(auth);$( "save").onclick=async()=>{try{await saveCurrent()}catch(e){msg("Couldn't save: "+e.message,true)}};$( "publish").onclick=async()=>{try{await publish()}catch(e){msg("Couldn't publish: "+e.message,true)}};$( "blank").onclick=()=>{fill({version:new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),title:"",notes:"",features:[],newGames:[],bugs:[],releaseDate:""})};
onAuthStateChanged(auth,user=>{if(user){$( "login").classList.add("hidden");$( "app").classList.remove("hidden");load().catch(e=>msg("Couldn't load changelogs: "+e.message,true))}else{$( "app").classList.add("hidden");$( "login").classList.remove("hidden")}});
</script>
</body></html>
